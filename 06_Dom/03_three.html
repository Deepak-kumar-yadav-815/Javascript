<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom | manipulation </title>
</head>
<body style="background-color: #212121;color: #ffff;">
    <div class="parent">Hi Deepak</div>
    <script>
        const div =document.createElement('div');
        div.className = "Deepak";
        div.style.backgroundColor ="green" ;
        div.style.padding = "40px";
        div.style.borderRadius = "50px";
        // div.innerHTML = "how is your Dom learing going one";
        const addtext = document.createTextNode("how is your learing going on");
        div.appendChild(addtext);
        const parent = document.body;
        parent.appendChild(div);
    </script>
</body>
</html>
